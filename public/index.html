<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PRODILIVE — trusted marketplace for music and creative production services">
<title>PRODILIVE — Music Production Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#121319;--ink-2:#191b23;--paper:#1e202b;--paper-2:#262838;--hair:#33354a;--brass:#c9a227;--brass-soft:#e8cf7a;--signal:#4fd1a5;--danger:#e0637c;--text:#f2f0e9;--text-dim:#a7a4b3;--text-faint:#6f6c7d;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.nav{position:sticky;top:0;z-index:50;background:rgba(18,19,25,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 0;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:700;font-size:19px;cursor:pointer}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:0 0 10px var(--brass)}
.nav-links{display:flex;align-items:center;gap:22px;font-size:13.5px;color:var(--text-dim)}
.nav-links a{cursor:pointer}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-cta{display:flex;gap:10px;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-brass{background:var(--brass);color:#1a1508}
.btn-brass:hover{background:var(--brass-soft)}
.btn-ghost{background:transparent;border-color:var(--hair);color:var(--text)}
.btn-ghost:hover{border-color:var(--text-dim)}
.btn-danger{background:transparent;border-color:#5a3037;color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
main{min-height:70vh}
section{padding:52px 0}
.eyebrow{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--brass);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--brass)}
.hero{padding:80px 0 60px}
.hero h1{font-size:48px;line-height:1.06;max-width:680px;margin-bottom:18px}
.hero p.lead{color:var(--text-dim);font-size:16.5px;line-height:1.6;max-width:520px;margin:0 0 28px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.searchbar{display:flex;gap:8px;background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:8px;max-width:480px}
.searchbar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:9px 11px;font-family:inherit}
.searchbar input::placeholder{color:var(--text-faint)}
.cat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.cat-pill{background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--text-dim)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.p-card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--radius);padding:20px;transition:.15s;cursor:pointer}
.p-card:hover{border-color:var(--brass);transform:translateY(-2px)}
.p-card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brass),#8a6b12);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1508;font-size:14px;flex:0 0 auto}
.avatar.lg{width:80px;height:80px;border-radius:16px;font-size:28px}
.p-card-top .meta b{display:block;font-size:15px}
.p-card-top .meta .role{font-size:12px;color:var(--brass-soft);margin-top:2px}
.badge{font-size:10px;padding:3px 8px;border-radius:999px;background:rgba(79,209,165,.14);color:var(--signal);font-weight:600}
.tag{font-size:11px;background:var(--paper-2);border:1px solid var(--hair);padding:4px 9px;border-radius:999px;color:var(--text-dim);display:inline-block;margin:0 5px 5px 0}
.p-card p.desc{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--hair);padding-top:12px;font-size:12px;color:var(--text-faint)}
.stars{color:var(--brass)}
.empty{text-align:center;padding:50px 20px;color:var(--text-faint)}
.empty .n{font-size:28px;margin-bottom:8px}
.status{font-size:10px;padding:4px 9px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.status.st-open,.status.st-active{background:rgba(79,209,165,.15);color:var(--signal)}
.status.st-pending,.status.st-wait{background:rgba(201,162,39,.15);color:var(--brass-soft)}
.status.st-done{background:rgba(167,164,179,.15);color:var(--text-dim)}
.status.st-bad{background:rgba(224,99,124,.15);color:var(--danger)}
.job-row{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:.15s}
.job-row:hover{border-color:var(--brass)}
.job-row .jh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.job-row .jh b{font-size:14.5px}
.job-row .jm{font-size:12px;color:var(--text-faint)}
.panel{background:var(--paper);border:1px solid var(--hair);border-radius:var(--radius);padding:22px}
.panel h4{margin:0 0 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.panel h4 span{font-size:11px;color:var(--text-faint);font-weight:400}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat-card{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:18px}
.stat-card .l{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.stat-card .v{font-family:'Fraunces',serif;font-size:24px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--ink-2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass)}
.field textarea{resize:vertical;min-height:80px}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,14,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border:1px solid var(--hair);border-radius:18px;width:100%;max-width:460px;padding:28px;max-height:88vh;overflow-y:auto;position:relative}
.modal.wide{max-width:620px}
.modal h3{font-size:20px;margin-bottom:4px}
.modal .sub{color:var(--text-faint);font-size:12.5px;margin-bottom:18px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-faint);font-size:20px}
.role-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.role-opt{border:1px solid var(--hair);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:13px}
.role-opt.sel{border-color:var(--brass);background:rgba(201,162,39,.08)}
.tabs-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:8px 15px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--text-dim);font-size:12.5px}
.tab-btn.active{background:var(--brass);color:#1a1508;border-color:var(--brass);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:0 8px 10px 0;font-weight:500}
td{padding:10px 8px 10px 0;border-top:1px solid var(--hair);color:var(--text-dim)}
tr:first-child td{border-top:none}
.msg{background:var(--paper-2);border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:13px}
.msg b{font-size:11.5px;color:var(--brass-soft);display:block;margin-bottom:3px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--brass);color:#1a1508;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#2a0d13}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#1a1508;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.notif-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--ink)}
.notif-drop{position:absolute;top:calc(100% + 10px);right:0;width:320px;background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:8px;max-height:400px;overflow-y:auto;display:none;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.notif-drop.open{display:block}
.notif-item{padding:10px 12px;border-radius:10px;font-size:12.5px}
.notif-item:hover{background:var(--paper-2)}
.notif-item b{display:block;font-size:12.5px;margin-bottom:2px}
.notif-item span{color:var(--text-faint);font-size:11.5px}
footer{border-top:1px solid var(--hair);padding:32px 0;margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-faint)}
.back-link{cursor:pointer;color:var(--text-faint);font-size:13px}
@media(max-width:900px){.grid-3{grid-template-columns:1fr 1fr}.dash-stats{grid-template-columns:1fr 1fr}.dash-cols{grid-template-columns:1fr}.nav-links{display:none}}
@media(max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr}.hero h1{font-size:34px}.dash-stats{grid-template-columns:1fr 1fr}.role-choice{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <div class="logo" onclick="go('home')"><span class="dot"></span>PRODILIVE</div>
    <nav class="nav-links">
      <a onclick="go('talents')">Find Talent</a>
      <a onclick="go('jobs')">Open Jobs</a>
      <a onclick="go('dashboard')" id="navDashLink" style="display:none">Dashboard</a>
      <a onclick="go('admin')" id="navAdminLink" style="display:none">Admin</a>
    </nav>
    <div class="nav-cta">
      <div id="signedOutBtns">
        <button class="btn btn-ghost btn-sm" onclick="openAuth('login')">Sign in</button>
        <button class="btn btn-brass btn-sm" onclick="openAuth('register')">Join PRODILIVE</button>
      </div>
      <div id="signedInBtns" style="display:none;align-items:center;gap:10px">
        <div style="position:relative">
          <button class="btn btn-ghost btn-sm" onclick="toggleNotif()" style="position:relative">🔔<span id="notifDot" class="notif-dot" style="display:none"></span></button>
          <div class="notif-drop" id="notifDrop"></div>
        </div>
        <span class="mono" id="navUserName" style="font-size:12px;color:var(--text-faint)"></span>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">Log out</button>
      
      </div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap"><div>PRODILIVE · Music production marketplace</div><div class="mono">NIGERIA · ₦NGN</div></div></footer>

<div class="modal-bg" id="authModal"><div class="modal">
  <button class="modal-close" onclick="closeModal('authModal')">&times;</button>
  <h3 id="authTitle">Welcome back</h3>
  <div class="sub" id="authSub">Sign in to manage your bookings and messages.</div>
  <form id="authForm" onsubmit="submitAuth(event)">
    <div class="field" id="nameField" style="display:none"><label>Full name</label><input id="authName" placeholder="e.g. Ebi Noel"></div>
    <div class="role-choice" id="roleChoice" style="display:none">
      <div class="role-opt sel" id="roleClientOpt" onclick="selectRole('client')">🎤 I'm a Client</div>
      <div class="role-opt" id="roleTalentOpt" onclick="selectRole('talent')">🎛️ I'm a Provider</div>
    </div>
    <div class="field"><label>Email address</label><input id="authEmail" type="email" placeholder="you@email.com" required></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="••••••••" minlength="8" required></div>
    <button class="btn btn-brass btn-block" type="submit" id="authSubmitBtn">Sign in</button>
  </form>
  <div style="text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:14px" id="authSwitch"></div>
</div></div>

<div class="modal-bg" id="jobModal"><div class="modal wide">
  <button class="modal-close" onclick="closeModal('jobModal')">&times;</button>
  <h3 id="jobModalTitle">Post a project</h3>
  <div class="sub" id="jobModalSub">Describe what you need — talents can apply, or you can hire directly.</div>
  <form onsubmit="submitJob(event)">
    <div class="field"><label>Project title</label><input id="jobTitle" required placeholder="e.g. Mix and master my new single"></div>
    <div class="field"><label>Description</label><textarea id="jobDesc" required minlength="10" placeholder="Genre, references, stems, turnaround..."></textarea></div>
    <div class="field"><label>Category</label><input id="jobCategory" placeholder="Mixing, Production, Session Musician..."></div>
    <div class="field"><label>Budget (NGN)</label><input id="jobBudget" type="number" min="1" required placeholder="150000"></div>
    <div class="field"><label>Included revisions</label><input id="jobRevisions" type="number" min="0" max="20" value="2"></div>
    <button class="btn btn-brass btn-block" type="submit" id="jobSubmitBtn">Publish project</button>
  </form>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============================ STATE ============================ */
const state = {
  token: localStorage.getItem('prodilive_token') || null,
  user: null,
  view: 'home',
  params: {},
  talentsCache: {},
  jobModalMode: 'open', // 'open' | 'hire'
  hireTalentId: null,
  authMode: 'login',
  authRole: 'client',
  notifications: [],
};

/* ============================ API HELPERS ============================ */
async function api(path, opt = {}) {
  const headers = { ...(opt.headers || {}) };
  if (!(opt.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch('/api' + path, { ...opt, headers });
  let body = {};
  try { body = await res.json(); } catch {}
  if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
  return body;
}
function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function fmt(n){ return '₦' + Number(n||0).toLocaleString('en-NG'); }
function stars(n){ n = Math.round(Number(n)||0); return '★'.repeat(n) + '☆'.repeat(5-n); }
function timeAgo(iso){ if(!iso) return ''; const d=(Date.now()-new Date(iso))/1000; if(d<60) return 'just now'; if(d<3600) return Math.floor(d/60)+'m ago'; if(d<86400) return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; }
function statusClass(s){
  const m = { OPEN:'st-open', IN_PROGRESS:'st-active', RELEASED:'st-open', APPROVED:'st-active',
    AWAITING_PAYMENT:'st-wait', QA_PENDING:'st-wait', CLIENT_REVIEW:'st-wait', REVISION_REQUESTED:'st-wait',
    CANCELLED:'st-done', DISPUTED:'st-bad', RESOLVED_RELEASE:'st-active' };
  return m[s] || 'st-done';
}
function statusLabel(s){ return String(s||'').replace(/_/g,' '); }
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=> t.classList.remove('show'), 3200);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openModal(id){ document.getElementById(id).classList.add('open'); }

/* ============================ ROUTER ============================ */
function go(view, params = {}) {
  if (needsAuth(view) && !state.user) { openAuth('login'); toast('Sign in to continue'); return; }
  state.view = view; state.params = params;
  document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function needsAuth(view){ return ['dashboard','admin','jobDetail'].includes(view); }

async function render() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="wrap" style="padding:80px 0;text-align:center;color:var(--text-faint)">Loading…</div>';
  try {
    const views = { home:viewHome, talents:viewTalents, talentProfile:viewTalentProfile, jobs:viewJobsOpen,
      jobDetail:viewJobDetail, dashboard:viewDashboard, admin:viewAdmin };
    app.innerHTML = await (views[state.view] || viewHome)();
  } catch (e) {
    app.innerHTML = `<div class="wrap" style="padding:80px 0"><div class="empty"><div class="n">⚠️</div><h3>Something went wrong</h3><p>${esc(e.message)}</p></div></div>`;
  }
}

/* ============================ AUTH ============================ */
function updateNav() {
  const signedIn = !!state.user;
  document.getElementById('signedOutBtns').style.display = signedIn ? 'none' : 'block';
  document.getElementById('signedInBtns').style.display = signedIn ? 'flex' : 'none';
  document.getElementById('navDashLink').style.display = signedIn ? 'inline' : 'none';
  document.getElementById('navAdminLink').style.display = (signedIn && state.user.role==='admin') ? 'inline' : 'none';
  if (signedIn) document.getElementById('navUserName').textContent = state.user.name + ' · ' + state.user.role.toUpperCase();
}
function openAuth(mode) {
  state.authMode = mode;
  document.getElementById('authTitle').textContent = mode==='login' ? 'Welcome back' : 'Create your account';
  document.getElementById('authSub').textContent = mode==='login' ? 'Sign in to manage your bookings and messages.' : 'Join as a client looking to hire, or a provider offering services.';
  document.getElementById('nameField').style.display = mode==='login' ? 'none' : 'block';
  document.getElementById('roleChoice').style.display = mode==='login' ? 'none' : 'grid';
  document.getElementById('authSubmitBtn').textContent = mode==='login' ? 'Sign in' : 'Create account';
  document.getElementById('authSwitch').innerHTML = mode==='login'
    ? `New to Prodilive? <a style="color:var(--brass-soft);cursor:pointer" onclick="openAuth('register')">Create an account</a>`
    : `Already have an account? <a style="color:var(--brass-soft);cursor:pointer" onclick="openAuth('login')">Sign in</a>`;
  openModal('authModal');
}
function selectRole(role) {
  state.authRole = role;
  document.getElementById('roleClientOpt').classList.toggle('sel', role==='client');
  document.getElementById('roleTalentOpt').classList.toggle('sel', role==='talent');
}
async function submitAuth(e) {
  e.preventDefault();
  const btn = document.getElementById('authSubmitBtn');
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    let data;
    if (state.authMode === 'login') {
      data = await api('/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
    } else {
      const name = document.getElementById('authName').value.trim();
      if (!name) throw new Error('Please enter your full name');
      data = await api('/auth/register', { method:'POST', body: JSON.stringify({ name, email, password, role: state.authRole }) });
    }
    state.token = data.token; state.user = data.user;
    localStorage.setItem('prodilive_token', data.token);
    closeModal('authModal');
    updateNav();
    loadNotifications();
    toast(state.authMode==='login' ? 'Signed in.' : 'Account created — welcome to PRODILIVE.');
    go('dashboard');
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
async function doLogout() {
  try { await api('/auth/logout', { method:'POST' }); } catch {}
  state.token = null; state.user = null;
  localStorage.removeItem('prodilive_token');
  updateNav();
  toast('Signed out.');
  go('home');
}
async function bootstrap() {
  if (state.token) {
    try {
      const d = await api('/me');
      state.user = d.user;
      loadNotifications();
    } catch { state.token = null; state.user = null; localStorage.removeItem('prodilive_token'); }
  }
  updateNav();
  render();
}

/* ============================ NOTIFICATIONS ============================ */
async function loadNotifications() {
  try {
    const d = await api('/notifications');
    state.notifications = d.notifications;
    const unread = d.notifications.filter(n=>!n.read_at).length;
    document.getElementById('notifDot').style.display = unread ? 'block' : 'none';
  } catch {}
}
function toggleNotif() {
  const el = document.getElementById('notifDrop');
  const opening = !el.classList.contains('open');
  el.classList.toggle('open');
  if (opening) {
    el.innerHTML = state.notifications.length
      ? state.notifications.slice(0,20).map(n=>`
        <div class="notif-item" onclick="readNotif('${n.id}')">
          <b>${esc(n.title)}</b><span>${esc(n.body||'')}</span>
          <div class="mono" style="font-size:10px;color:var(--text-faint);margin-top:3px">${timeAgo(n.created_at)}</div>
        </div>`).join('')
      : `<div class="notif-item"><span>No notifications yet.</span></div>`;
  }
}
async function readNotif(id) {
  try { await api('/notifications/'+id+'/read', { method:'POST' }); loadNotifications(); } catch {}
}
document.addEventListener('click', (e)=>{
  const drop = document.getElementById('notifDrop');
  if (drop.classList.contains('open') && !e.target.closest('.nav-cta')) drop.classList.remove('open');
});

/* ============================ POST / HIRE JOB MODAL ============================ */
function openJobModal(mode, talentId, talentName) {
  if (!state.user) { openAuth('register'); return; }
  state.jobModalMode = mode;
  state.hireTalentId = talentId || null;
  document.getElementById('jobModalTitle').textContent = mode==='hire' ? `Hire ${talentName}` : 'Post a project';
  document.getElementById('jobModalSub').textContent = mode==='hire'
    ? `This project will be assigned directly to ${talentName}. You'll fund it once they accept.`
    : 'Talents can apply — you choose who to hire.';
  document.getElementById('jobTitle').value = '';
  document.getElementById('jobDesc').value = '';
  document.getElementById('jobCategory').value = '';
  document.getElementById('jobBudget').value = '';
  document.getElementById('jobRevisions').value = 2;
  openModal('jobModal');
}
async function submitJob(e) {
  e.preventDefault();
  const btn = document.getElementById('jobSubmitBtn');
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const payload = {
      title: document.getElementById('jobTitle').value.trim(),
      description: document.getElementById('jobDesc').value.trim(),
      category: document.getElementById('jobCategory').value.trim() || undefined,
      budget: Number(document.getElementById('jobBudget').value),
      revisionCount: Number(document.getElementById('jobRevisions').value || 2),
    };
    const job = await api('/jobs', { method:'POST', body: JSON.stringify(payload) });
    if (state.jobModalMode === 'hire' && state.hireTalentId) {
      await api('/jobs/'+job.id+'/assign', { method:'POST', body: JSON.stringify({ talentId: state.hireTalentId }) });
      toast('Project sent — fund it to get started.');
    } else {
      toast('Project published to the open marketplace.');
    }
    closeModal('jobModal');
    go('jobDetail', { id: job.id });
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

/* ============================ JOB ACTIONS ============================ */
async function reload() { await render(); }
async function applyToJob(id) {
  try {
    await api('/jobs/'+id+'/apply', { method:'POST', body: JSON.stringify({ message: document.getElementById('applyMsg').value, quote: document.getElementById('applyQuote').value || undefined }) });
    toast('Proposal submitted.'); reload();
  } catch(e) { toast(e.message, true); }
}
async function acceptProposal(pid) {
  try { await api('/proposals/'+pid+'/accept', { method:'POST' }); toast('Talent assigned.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function fundJob(id) {
  try {
    const d = await api('/payments/initialize', { method:'POST', body: JSON.stringify({ jobId:id }) });
    toast('Redirecting to Paystack…');
    window.location.href = d.authorization_url;
  } catch(e) { toast(e.message, true); }
}
async function deliverJob(id) {
  const input = document.getElementById('deliverFiles');
  if (!input.files.length) { toast('Choose at least one file.', true); return; }
  const fd = new FormData();
  for (const f of input.files) fd.append('files', f);
  try { await api('/jobs/'+id+'/deliver', { method:'POST', body: fd }); toast('Delivery submitted.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function submitQa(id, result) {
  try { await api('/jobs/'+id+'/qa', { method:'POST', body: JSON.stringify({ technical: result, notes: [] }) }); toast('QA recorded.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function approveJob(id) {
  try { await api('/jobs/'+id+'/approve', { method:'POST' }); toast('Delivery approved — payout pending.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function requestRevision(id) {
  const reason = prompt('What needs to change?');
  if (reason === null) return;
  try { await api('/jobs/'+id+'/revision', { method:'POST', body: JSON.stringify({ reason }) }); toast('Revision requested.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function openDispute(id) {
  const reason = prompt('Describe the issue for our review team:');
  if (reason === null) return;
  try { await api('/jobs/'+id+'/dispute', { method:'POST', body: JSON.stringify({ reason }) }); toast('Dispute opened — a reviewer will step in.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function decideDispute(id, outcome) {
  try { await api('/reviewer/disputes/'+id+'/decision', { method:'POST', body: JSON.stringify({ outcome }) }); toast('Dispute resolved.'); reload(); }
  catch(e) { toast(e.message, true); }
}
async function submitReview(id) {
  try {
    await api('/jobs/'+id+'/review', { method:'POST', body: JSON.stringify({ rating: Number(document.getElementById('reviewRating').value), comment: document.getElementById('reviewComment').value }) });
    toast('Review submitted. Thank you!'); reload();
  } catch(e) { toast(e.message, true); }
}
async function sendMessage(jobId) {
  const body = document.getElementById('msgBody').value.trim();
  if (!body) return;
  try { await api('/messages/'+jobId, { method:'POST', body: JSON.stringify({ body }) }); document.getElementById('msgBody').value=''; reload(); }
  catch(e) { toast(e.message, true); }
}

/* ============================ VIEW: DASHBOARD ============================ */
async function viewDashboard() {
  const u = state.user;
  let jobs = [];
  try { jobs = (await api('/jobs')).jobs; } catch(e) { toast(e.message, true); }
  const mine = jobs.filter(j => j.client_id===u.id || j.talent_id===u.id);
  const active = mine.filter(j=>['IN_PROGRESS','QA_PENDING','CLIENT_REVIEW','REVISION_REQUESTED','AWAITING_PAYMENT'].includes(j.status)).length;
  const done = mine.filter(j=>j.status==='RELEASED').length;

  return `
  <section style="padding-top:32px"><div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div><div class="eyebrow">${u.role.toUpperCase()} DASHBOARD</div><h1 style="font-size:26px">Welcome back, ${esc(u.name.split(' ')[0])}</h1></div>
      ${u.role==='client' ? `<button class="btn btn-brass" onclick="openJobModal('open')">+ Post a project</button>` : ''}
    </div>

    <div class="dash-stats">
      <div class="stat-card"><div class="l">Total projects</div><div class="v">${mine.length}</div></div>
      <div class="stat-card"><div class="l">Active</div><div class="v" style="color:var(--brass-soft)">${active}</div></div>
      <div class="stat-card"><div class="l">Completed</div><div class="v" style="color:var(--signal)">${done}</div></div>
      <div class="stat-card"><div class="l">Role</div><div class="v" style="font-size:18px">${esc(u.role)}</div></div>
    </div>

    <div class="dash-cols">
      <div class="panel">
        <h4>My projects <span>${mine.length} total</span></h4>
        ${mine.length ? mine.map(jobRow).join('') : `<p style="color:var(--text-faint);font-size:13px">No projects yet.</p>`}
      </div>
      <div class="panel">
        <h4>Profile</h4>
        <div class="field"><label>Name</label><input id="pfName" value="${esc(u.name)}"></div>
        <div class="field"><label>Bio</label><textarea id="pfBio">${esc(u.bio||'')}</textarea></div>
        <div class="field"><label>Skills (comma separated)</label><input id="pfSkills" value="${esc((u.skills||[]).join(', '))}"></div>
        <button class="btn btn-brass btn-sm" onclick="saveProfile()">Save profile</button>
        ${u.role==='talent' ? `
          <div style="border-top:1px solid var(--hair);margin-top:18px;padding-top:16px">
            <h4 style="margin-bottom:10px">Payout details</h4>
            <div class="field"><label>Bank code (3 digits)</label><input id="pfBankCode" placeholder="058"></div>
            <div class="field"><label>Account number (10 digits)</label><input id="pfAccount" placeholder="0123456789"></div>
            <button class="btn btn-ghost btn-sm" onclick="savePayout()">Save payout details</button>
          </div>` : ''}
      </div>
    </div>
  </div></section>`;
}
async function saveProfile() {
  try {
    const skills = document.getElementById('pfSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
    const d = await api('/me', { method:'PUT', body: JSON.stringify({ name: document.getElementById('pfName').value.trim(), bio: document.getElementById('pfBio').value, skills }) });
    state.user = d.user; updateNav(); toast('Profile saved.');
  } catch(e) { toast(e.message, true); }
}
async function savePayout() {
  try {
    await api('/me/payout-profile', { method:'PUT', body: JSON.stringify({ bankCode: document.getElementById('pfBankCode').value.trim(), accountNumber: document.getElementById('pfAccount').value.trim() }) });
    toast('Payout details saved.');
  } catch(e) { toast(e.message, true); }
}

/* ============================ VIEW: ADMIN ============================ */
async function viewAdmin() {
  if (!state.user || state.user.role !== 'admin') return `<div class="wrap" style="padding:60px 0"><div class="empty"><div class="n">🔒</div><h3>Admins only</h3></div></div>`;
  const tab = state.params.tab || 'overview';
  let overview = {}, users = [], jobs = [], payments = [], apps = [];
  try {
    if (tab==='overview') overview = await api('/admin/overview');
    if (tab==='users') users = (await api('/admin/users')).users;
    if (tab==='jobs') jobs = (await api('/admin/jobs')).jobs;
    if (tab==='payments') payments = (await api('/admin/payments')).payments;
    if (tab==='reviewers') apps = (await api('/admin/reviewer-applications')).applications;
  } catch(e) { toast(e.message, true); }

  const tabs = [['overview','Overview'],['users','Users'],['jobs','Jobs'],['payments','Payments'],['reviewers','Reviewer Apps']];
  let body = '';
  if (tab==='overview') {
    body = `<div class="dash-stats">
      <div class="stat-card"><div class="l">Total users</div><div class="v">${overview.users??'—'}</div></div>
      <div class="stat-card"><div class="l">Total jobs</div><div class="v">${overview.jobs??'—'}</div></div>
      <div class="stat-card"><div class="l">Revenue held/released</div><div class="v mono" style="font-size:19px">${fmt(overview.revenue||0)}</div></div>
      <div class="stat-card"><div class="l">Open disputes</div><div class="v" style="color:var(--danger)">${overview.openDisputes??'—'}</div></div>
    </div>`;
  } else if (tab==='users') {
    body = `<div class="panel"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
      ${users.map(u=>`<tr><td style="color:var(--text)">${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}</td>
        <td>${u.status==='SUSPENDED' ? `<button class="btn btn-ghost btn-sm" onclick="adminReactivate('${u.id}')">Reactivate</button>` : `<button class="btn btn-danger btn-sm" onclick="adminSuspend('${u.id}')">Suspend</button>`}</td></tr>`).join('')}
      </table></div>`;
  } else if (tab==='jobs') {
    body = `<div class="panel"><table><tr><th>Title</th><th>Client</th><th>Talent</th><th>Budget</th><th>Status</th></tr>
      ${jobs.map(j=>`<tr><td style="color:var(--text)">${esc(j.title)}</td><td>${esc(j.clientName||'—')}</td><td>${esc(j.talentName||'—')}</td><td>${fmt(j.budget)}</td><td><span class="status ${statusClass(j.status)}">${statusLabel(j.status)}</span></td></tr>`).join('')}
      </table></div>`;
  } else if (tab==='payments') {
    body = `<div class="panel"><table><tr><th>Job</th><th>Amount</th><th>Status</th><th>Reference</th></tr>
      ${payments.map(p=>`<tr><td style="color:var(--text)">${esc(p.job_title)}</td><td>${fmt(p.amount)}</td><td>${esc(p.status)}</td><td class="mono" style="font-size:11px">${esc(p.reference)}</td></tr>`).join('')}
      </table></div>`;
  } else if (tab==='reviewers') {
    body = `<div class="panel">${apps.length ? apps.map(a=>`
      <div style="border-top:1px solid var(--hair);padding:12px 0;display:flex;justify-content:space-between;align-items:center">
        <div><b style="font-size:13.5px">${esc(a.name)}</b><div style="font-size:12px;color:var(--text-faint)">${esc(a.email)} · ${esc(a.status)}</div></div>
        ${a.status==='PENDING' ? `<button class="btn btn-brass btn-sm" onclick="adminDecideReviewer('${a.id}',true)">Approve</button>` : ''}
      </div>`).join('') : `<p style="color:var(--text-faint);font-size:13px">No applications.</p>`}</div>`;
  }

  return `
  <section style="padding-top:32px"><div class="wrap">
    <div class="eyebrow">ADMIN</div><h1 style="font-size:26px;margin-bottom:20px">Platform overview</h1>
    <div class="tabs-row">${tabs.map(([k,l])=>`<button class="tab-btn ${tab===k?'active':''}" onclick="go('admin',{tab:'${k}'})">${l}</button>`).join('')}</div>
    ${body}
  </div></section>`;
}
async function adminSuspend(id) { try { await api('/admin/users/'+id+'/suspend', { method:'POST' }); toast('User suspended.'); reload(); } catch(e){ toast(e.message, true); } }
async function adminReactivate(id) { try { await api('/admin/users/'+id+'/reactivate', { method:'POST' }); toast('User reactivated.'); reload(); } catch(e){ toast(e.message, true); } }
async function adminDecideReviewer(id, approved) { try { await api('/admin/reviewer-applications/'+id+'/decision', { method:'POST', body: JSON.stringify({ approved }) }); toast('Decision recorded.'); reload(); } catch(e){ toast(e.message, true); } }

/* ============================ INIT ============================ */
bootstrap();
</script>
</body>
</html>
